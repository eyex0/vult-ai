name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: vult-monorepo

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vult_owner
          POSTGRES_PASSWORD: ci-owner
          POSTGRES_DB: vult
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U vult_owner -d vult"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      OWNER_URL: postgresql://vult_owner:ci-owner@localhost:5432/vult
      APP_URL: postgresql://vult_app:ci-app@localhost:5432/vult
      SHADOW_URL: postgresql://vult_owner:ci-owner@localhost:5432/vult_shadow
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: vult-monorepo/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile

      - name: Build, typecheck, unit tests
        run: pnpm turbo run build typecheck test --ui=stream

      - name: App role and shadow database
        run: |
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE vult_app LOGIN PASSWORD 'ci-app' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE vult_shadow"

      - name: Migrations, row-level security check, schema drift check
        working-directory: vult-monorepo/packages/database
        env:
          DATABASE_URL: ${{ env.OWNER_URL }}
        run: |
          pnpm db:migrate
          pnpm db:check-rls
          pnpm exec prisma migrate diff --from-migrations prisma/migrations \
            --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$SHADOW_URL" --exit-code

      - name: API end-to-end tests as the restricted app role
        working-directory: vult-monorepo/apps/api-server
        env:
          DATABASE_URL: ${{ env.APP_URL }}
          VULT_E2E: "1"
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 30
    strategy:
      matrix:
        target: [api, worker, migrate, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build ${{ matrix.target }} image
        uses: docker/build-push-action@v6
        with:
          context: vult-monorepo
          target: ${{ matrix.target }}
          build-args: VITE_API_URL=https://api.example.com
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
