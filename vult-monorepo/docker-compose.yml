services:
  postgres:
    image: postgres:16-alpine
    container_name: vult_postgres
    environment:
      POSTGRES_USER: vult_admin
      POSTGRES_PASSWORD: local-development-only
      POSTGRES_DB: vult_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vult_admin -d vult_local"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: vult_redis
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.12.5
    container_name: vult_qdrant
    ports:
      - "127.0.0.1:6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "bash", "-c", "echo -n > /dev/tcp/127.0.0.1/6333"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  qdrant_data:
