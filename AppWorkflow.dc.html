<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workflow builder · Vult</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&amp;display=swap">
<style>
body{margin:0;background:#101112}
a{color:#E9EAEE;text-decoration:none}a:hover{color:#FFFFFF}
.v-app *{box-sizing:border-box}
.v-app button,.v-app select,.v-app input,.v-app textarea{font-family:inherit}
.v-app button{cursor:pointer}
.v-app a:focus-visible,.v-app button:focus-visible,.v-app input:focus-visible,.v-app select:focus-visible,.v-app textarea:focus-visible{outline:2px solid #6F87FF;outline-offset:1px;border-radius:7px}
.v-logo-d img{filter:invert(1);mix-blend-mode:screen}
.v-nav-item{transition:background .15s,color .15s}
.v-nav-item:hover{background:#17181A;color:#FFFFFF !important}
.v-hov{transition:background .15s}
.v-hov:hover{background:#1A1B1E !important}
.v-burger{display:none !important}
@media (max-width:900px){
.v-side{display:none !important}
.v-side.v-open{display:flex !important;position:fixed;inset:0 auto 0 0;z-index:80;width:274px !important;box-shadow:0 0 0 100vmax rgba(0,0,0,.55)}
.v-burger{display:inline-flex !important}
}
.v-app{--spring:linear(0,.009,.035 2.1%,.141,.281 6.7%,.723 12.9%,.938 16.7%,1.017,1.077,1.121 24.3%,1.13,1.12 30.3%,1.017 39.4%,.991 44.6%,1.001 63.4%,1);--out:cubic-bezier(.16,1,.3,1)}
.v-app button:active{transform:scale(.96)}
@keyframes vIn{from{opacity:0;transform:translateY(12px);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
@keyframes vSlideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes vPanel{from{opacity:0;transform:translateX(48px)}to{opacity:1;transform:none}}
@keyframes vModal{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes vFadeBg{from{opacity:0}to{opacity:1}}
@keyframes vGrowY{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes vGrowX{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes vTick{from{transform:scale(0) rotate(-25deg)}to{transform:none}}
@keyframes vRing{0%{box-shadow:0 0 0 0 currentColor}100%{box-shadow:0 0 0 7px transparent}}
@keyframes vFlow{0%{top:-3px;opacity:0}15%,85%{opacity:1}100%{top:25px;opacity:0}}
.v-in>*{animation:vIn .6s var(--out) both}
.v-in>*:nth-child(2){animation-delay:.04s}.v-in>*:nth-child(3){animation-delay:.08s}.v-in>*:nth-child(4){animation-delay:.12s}.v-in>*:nth-child(5){animation-delay:.16s}.v-in>*:nth-child(6){animation-delay:.2s}.v-in>*:nth-child(7){animation-delay:.24s}.v-in>*:nth-child(8){animation-delay:.28s}.v-in>*:nth-child(9){animation-delay:.32s}.v-in>*:nth-child(10){animation-delay:.36s}.v-in>*:nth-child(11){animation-delay:.4s}.v-in>*:nth-child(n+12){animation-delay:.44s}
.v-nav-in>*{animation:vSlideIn .45s var(--out) both}
.v-nav-in>*:nth-child(2){animation-delay:.03s}.v-nav-in>*:nth-child(3){animation-delay:.06s}.v-nav-in>*:nth-child(4){animation-delay:.09s}.v-nav-in>*:nth-child(5){animation-delay:.12s}.v-nav-in>*:nth-child(6){animation-delay:.15s}.v-nav-in>*:nth-child(7){animation-delay:.18s}.v-nav-in>*:nth-child(8){animation-delay:.21s}.v-nav-in>*:nth-child(n+9){animation-delay:.24s}
.v-pop,.v-modal{animation:vModal .45s var(--spring) both}
.v-panel{animation:vPanel .55s var(--spring) both}
.v-backdrop{animation:vFadeBg .2s ease-out both}
.v-bar-y{transform-origin:bottom;animation:vGrowY 1.1s var(--out) .2s both}
.v-bar-x{transform-origin:left;animation:vGrowX 1.1s var(--out) .3s both}
.v-tick{animation:vTick .45s var(--spring) both}
.v-ping{color:currentColor;animation:vRing 1.6s ease-out infinite}
.v-card{transition:transform .5s var(--spring),border-color .15s,box-shadow .3s !important}
.v-card:hover{transform:translateY(-2px);box-shadow:0 14px 30px -14px rgba(0,0,0,.8)}
.v-card:active{cursor:grabbing;transform:rotate(-1.5deg) scale(1.03)}
.v-step-btn{transition:border-color .2s,box-shadow .35s,transform .5s var(--spring)}
.v-step-btn:hover{transform:translateY(-2px)}
.v-step-btn[aria-pressed="true"]{box-shadow:0 0 0 4px rgba(111,135,255,.14),0 14px 32px -14px rgba(59,91,253,.6)}
.v-line{position:relative;transform-origin:top;animation:vGrowY .5s var(--out) .3s both}
.v-line::after{content:"";position:absolute;left:-2.25px;top:0;width:6px;height:6px;border-radius:50%;background:#6F87FF;box-shadow:0 0 8px #6F87FF;animation:vFlow 2.2s linear infinite}
@media (prefers-reduced-motion:reduce){.v-app *{animation:none !important;transition:none !important}}
</style>
</helmet>
<div class="v-app" style="font-family: Inter, ui-sans-serif, system-ui, sans-serif; color: #E9EAEE; background: #101112; height: 100vh; min-height: 620px; display: flex; font-size: 13.5px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden">

<aside class="v-side {{sideOpenClass}}" aria-label="Workspace navigation" style="width: 274px; flex: none; background: #0B0C0D; border-right: 1px solid #242526; display: flex; flex-direction: column; overflow: hidden">
<div style="height: 49px; display: flex; align-items: center; gap: 8px; padding: 0 16px; border-bottom: 1px solid #1C1D1F">
<span class="v-logo-d" style="width: 24px; height: 24px; border-radius: 6px; background: #000; border: 1px solid #2A2C31; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; flex: none"><img src="/_blob/3fdb3fc4dac38e884c52e67a57146da8" alt="" style="width: 30px; height: 30px; flex: none"></span>
<span style="font-weight: 600; color: #FFFFFF">Ridgeway Labs</span>
</div>
<nav class="v-nav-in" style="flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 1px">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="{{n.href}}" class="v-nav-item" aria-current="{{n.current}}" style="height: 30px; display: flex; align-items: center; gap: 9px; padding: 0 8px; border-radius: 7px; color: {{n.fg}}; background: {{n.bg}}; white-space: nowrap">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex: none"><path d="{{n.icon}}"></path></svg><span>{{n.label}}</span>
</a>
</sc-for>
</nav>
</aside>

<div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<header style="min-height: 49px; flex: none; border-bottom: 1px solid #242526; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 14px 8px 16px">
<button type="button" class="v-burger v-nav-item" onClick="{{toggleMobile}}" aria-label="Open navigation" style="width: 32px; height: 32px; border: 1px solid #242526; background: transparent; border-radius: 7px; color: #E9EAEE; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"></path></svg></button>
<a href="#" style="color: #8A8D96; font-size: 13px">Workflows</a>
<span aria-hidden="true" style="color: #4A4C52">/</span>
<h1 style="margin: 0; font-size: 14px; font-weight: 600; color: #FFFFFF">Route inbound demo requests</h1>
<span style="display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 6px; background: {{statusBg}}; color: {{statusFg}}; font-size: 12px"><span class="v-ping" style="width: 6px; height: 6px; border-radius: 50%; background: {{statusFg}}; color: {{statusFg}}"></span>{{statusLabel}}</span>
<span style="margin-left: auto"></span>
<button type="button" class="v-hov" style="height: 30px; padding: 0 10px; border: 1px solid #242526; border-radius: 7px; background: transparent; color: #C9CBD2; font-size: 13px">Run history</button>
<button type="button" onClick="{{toggleLive}}" style="height: 30px; padding: 0 12px; border: 0; border-radius: 7px; background: #3B5BFD; color: #FFFFFF; font-weight: 550; font-size: 13px">{{liveAction}}</button>
</header>

<div style="flex: 1; min-height: 0; display: flex; flex-wrap: wrap">
<main style="flex: 999 1 560px; min-width: 0; overflow-y: auto; padding: 32px 16px; background-color: #101112; background-image: radial-gradient(#1F2023 1px, transparent 1px); background-size: 20px 20px">
<ol aria-label="Workflow steps" class="v-in" style="list-style: none; margin: 0 auto; padding: 0; max-width: 440px; display: flex; flex-direction: column; align-items: stretch">
<sc-for list="{{steps}}" as="st" hint-placeholder-count="5">
<li style="display: flex; flex-direction: column; align-items: center">
<button type="button" class="v-step-btn" onClick="{{st.select}}" aria-pressed="{{st.selected}}" style="width: 100%; text-align: left; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 12px; background: #17181A; border: 1.5px solid {{st.border}}; color: #E9EAEE">
<span style="width: 30px; height: 30px; border-radius: 8px; background: {{st.color}}; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{st.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 11px; color: #8A8D96; font-weight: 600; letter-spacing: .04em; text-transform: uppercase">{{st.kind}}</span><span style="color: #FFFFFF; font-weight: 550">{{st.title}}</span><span style="color: #A9ACB6; font-size: 12.5px">{{st.detail}}</span></span>
</button>
<span aria-hidden="true" class="v-line" style="width: 1.5px; height: 28px; background: #2E3033"></span>
</li>
</sc-for>
<li style="display: flex; justify-content: center">
<button type="button" onClick="{{addStep}}" class="v-hov" style="height: 32px; padding: 0 12px; border: 1px dashed #3A3C40; border-radius: 8px; background: #101112; color: #C9CBD2; font-size: 12.5px; display: inline-flex; align-items: center; gap: 6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>Add step</button>
</li>
</ol>
</main>

<aside aria-label="Step settings" class="v-in" style="flex: 1 1 320px; max-width: 100%; border-left: 1px solid #242526; background: #0E0F10; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 28px; height: 28px; border-radius: 8px; background: {{sel.color}}; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{sel.icon}}"></path></svg></span>
<span style="display: flex; flex-direction: column"><span style="font-size: 11px; color: #8A8D96; font-weight: 600; letter-spacing: .04em; text-transform: uppercase">{{sel.kind}}</span><h2 style="margin: 0; font-size: 14px; font-weight: 600; color: #FFFFFF">{{sel.title}}</h2></span>
</div>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #A9ACB6">Step name
<input type="text" value="{{sel.title}}" onInput="{{renameSel}}" style="height: 34px; border: 1px solid #2E3033; border-radius: 7px; background: #111214; color: #FFFFFF; padding: 0 10px; font-size: 13px; outline: 0">
</label>
<label style="display: flex; flex-direction: column; gap: 6px; font-size: 12.5px; color: #A9ACB6">Configuration
<textarea rows="4" value="{{sel.detail}}" onInput="{{detailSel}}" style="border: 1px solid #2E3033; border-radius: 7px; background: #111214; color: #FFFFFF; padding: 8px 10px; font-size: 13px; resize: vertical; outline: 0"></textarea>
</label>
<div style="border: 1px solid #242526; border-radius: 10px; padding: 12px; display: flex; flex-direction: column; gap: 6px; font-size: 12.5px">
<span style="color: #FFFFFF; font-weight: 550">Last 7 days</span>
<span style="display: flex; justify-content: space-between; color: #A9ACB6">Runs <span style="color: #E9EAEE">142</span></span>
<span style="display: flex; justify-content: space-between; color: #A9ACB6">Succeeded <span style="color: #69DB7C">139</span></span>
<span style="display: flex; justify-content: space-between; color: #A9ACB6">Failed <span style="color: #F59090">3</span></span>
</div>
<sc-if value="{{canDelete}}" hint-placeholder-val="{{ true }}">
<button type="button" onClick="{{deleteSel}}" class="v-hov" style="align-self: flex-start; height: 30px; padding: 0 10px; border: 1px solid #3A2A2C; border-radius: 7px; background: transparent; color: #F59090; font-size: 12.5px">Delete step</button>
</sc-if>
</aside>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      mobileOpen: false, live: true, sel: 2, nextId: 6,
      steps: [
        { id: 1, type: 'trigger', title: 'Form submitted', detail: 'Website · “Book a demo” form' },
        { id: 2, type: 'agent', title: 'Research the company', detail: 'Agent enriches size, industry and tech stack from the web' },
        { id: 3, type: 'condition', title: 'Company size ≥ 200', detail: 'If true continue, else send nurture email' },
        { id: 4, type: 'action', title: 'Assign owner', detail: 'Round-robin across Enterprise AEs' },
        { id: 5, type: 'notify', title: 'Post to #inbound', detail: 'Slack message with research summary' }
      ]
    };
  }
  renderVals() {
    const s = this.state;
    const I = {
      home: 'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z',
      deals: 'M4 7h16v12H4zM9 7V5h6v2',
      reports: 'M4 20V10M10 20V4M16 20v-7M2 20h20',
      workflows: 'M4 4h6v6H4zM14 14h6v6h-6zM7 10v4a3 3 0 0 0 3 3h4'
    };
    const T = {
      trigger: ['Trigger', '#F2994A', 'M13 2L4 14h7l-1 8 9-12h-7z'],
      agent: ['Agent', '#3B5BFD', 'M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z'],
      condition: ['Condition', '#7048E8', 'M6 3v6a6 6 0 0 0 6 6h6M15 12l3 3-3 3M6 21v-6'],
      action: ['Action', '#0B7285', 'M9 11l3 3 8-8M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11'],
      notify: ['Notify', '#2F9E44', 'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10 21h4']
    };
    const deco = (st) => ({ kind: T[st.type][0], color: T[st.type][1], icon: T[st.type][2] });
    const cur = s.steps.find((x) => x.id === s.sel) || s.steps[0];
    const patch = (f) => this.setState({ steps: s.steps.map((x) => x.id === cur.id ? Object.assign({}, x, f) : x) });
    return {
      nav: [['Home', 'home', 'AppHome.dc.html'], ['Deals', 'deals', 'AppDeals.dc.html'], ['Reports', 'reports', 'AppReports.dc.html'], ['Workflows', 'workflows', 'AppWorkflow.dc.html']].map((n) => ({ label: n[0], icon: I[n[1]], href: n[2], current: n[0] === 'Workflows' ? 'page' : 'false', bg: n[0] === 'Workflows' ? '#1C1D20' : 'transparent', fg: n[0] === 'Workflows' ? '#FFFFFF' : '#A9ACB6' })),
      sideOpenClass: s.mobileOpen ? 'v-open' : '',
      toggleMobile: () => this.setState({ mobileOpen: !s.mobileOpen }),
      statusLabel: s.live ? 'Live' : 'Paused',
      statusBg: s.live ? 'rgba(64,192,87,.14)' : '#1E1F22',
      statusFg: s.live ? '#69DB7C' : '#A9ACB6',
      liveAction: s.live ? 'Pause' : 'Publish',
      toggleLive: () => this.setState({ live: !s.live }),
      steps: s.steps.map((st) => Object.assign({}, st, deco(st), {
        selected: st.id === cur.id,
        border: st.id === cur.id ? '#6F87FF' : '#2A2B2E',
        select: () => this.setState({ sel: st.id })
      })),
      sel: Object.assign({}, cur, deco(cur)),
      renameSel: (e) => patch({ title: e.target.value }),
      detailSel: (e) => patch({ detail: e.target.value }),
      canDelete: cur.type !== 'trigger',
      deleteSel: () => {
        const rest = s.steps.filter((x) => x.id !== cur.id);
        this.setState({ steps: rest, sel: rest[rest.length - 1].id });
      },
      addStep: () => this.setState({
        steps: s.steps.concat([{ id: s.nextId, type: 'action', title: 'New action', detail: 'Choose what this step does' }]),
        sel: s.nextId, nextId: s.nextId + 1
      })
    };
  }
}
</script>
</body>
</html>
